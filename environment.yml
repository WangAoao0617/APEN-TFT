name: apen-tft

channels:
  - conda-forge

dependencies:
  - python=3.10.17
  - numpy=1.26.4
  - pandas=2.2.3
  - scikit-learn=1.6.1
  - pyyaml=6.0.2
  - optuna=4.3.0
  - openpyxl=3.1.5
  - pip

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.7.1+cu128
      - lightning==2.2.1
      - pytorch-lightning==2.5.2
      - pytorch-forecasting==1.4.0
      - torchmetrics==1.3.1
